<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login | Indonesia AI Admin</title>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <style>
    *{box-sizing:border-box}
    :root{--bg:#171212;--panel:#211919;--border:#3b2d2d;--text:#f3eeee;--muted:#9f9393;--accent:#e84d4d}
    html,body{min-height:100%}
    body{
      margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      padding:24px;background:
      radial-gradient(circle at 50% 8%,rgba(232,77,77,.08),transparent 30%),
      var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif
    }
    .login-card{
      width:100%;max-width:390px;padding:38px 36px 30px;
      background:rgba(33,25,25,.97);border:1px solid var(--border);
      border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.28)
    }
    h1{margin:0 0 7px;text-align:center;font-size:23px}
    .intro{margin:0 0 25px;text-align:center;color:var(--muted);font-size:12px}
    form{display:flex;flex-direction:column;gap:8px}
    label{margin:5px 0 1px;color:#c4b8b8;font-size:11px;font-weight:700}
    .field{
      height:44px;display:flex;align-items:center;gap:10px;padding:0 13px;
      background:#181212;border:1px solid #403030;border-radius:8px;
      transition:border-color .15s ease,box-shadow .15s ease
    }
    .field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,77,77,.09)}
    .field i{width:15px;text-align:center;color:#786d6d;font-size:13px}
    input{width:100%;height:100%;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:13px}
    input::placeholder{color:#625858}
    button{
      height:45px;margin-top:13px;border:1px solid var(--accent);border-radius:8px;
      background:var(--accent);color:#fff;font-weight:700;font-size:13px;cursor:pointer
    }
    button:hover{filter:brightness(1.08)}
    .error{
      display:flex;align-items:center;gap:9px;margin:0 0 17px;padding:10px 12px;
      border:1px solid #683638;border-radius:8px;background:#30191b;color:#f3b1b1;font-size:11px
    }
    .footer{margin-top:24px;text-align:center;color:#756969;font-size:10px}
    .footer i{margin-right:6px}
    @media(max-width:480px){.login-card{padding:30px 24px 25px}}
  </style>
</head>
<body>
  <section class="login-card">

    <h1>Welcome back</h1>
    <p class="intro">Sign in to access WhatsApp AI Admin Dashboard.</p>

    {% if error %}
    <div class="error"><i class="fa-solid fa-circle-exclamation"></i><span>{{ error }}</span></div>
    {% endif %}

    <form method="post">
      <label for="username">Username</label>
      <div class="field">
        <i class="fa-regular fa-user"></i>
        <input id="username" name="username" type="text" autocomplete="username" placeholder="Enter username" required autofocus>
      </div>

      <label for="password">Password</label>
      <div class="field">
        <i class="fa-solid fa-lock"></i>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter password" required>
      </div>

      <button type="submit">Sign in&nbsp;&nbsp;<i class="fa-solid fa-arrow-right"></i></button>
    </form>

    <div class="footer"><i class="fa-solid fa-shield-halved"></i>Authorized access only</div>
  </section>
</body>
</html>
