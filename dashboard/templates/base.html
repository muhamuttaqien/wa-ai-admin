<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Indonesia AI Admin</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
<header>
  <div>
    <div class="brand">Indonesia AI</div>
    <div class="subtitle">WhatsApp AI Admin Dashboard</div>
  </div>
  <nav>
    <a class="{{ 'active' if channel=='B2C' else '' }}" href="{{ url_for('b2c') }}">
      <i class="fa-solid fa-user" aria-hidden="true"></i><span>Admin B2C</span>
    </a>
    <a class="{{ 'active' if channel=='B2B' else '' }}" href="{{ url_for('b2b') }}">
      <i class="fa-solid fa-building" aria-hidden="true"></i><span>Admin B2B</span>
    </a>
    <form class="logout-form" method="post" action="{{ url_for('logout') }}">
      <button class="logout-button" type="submit" title="Logout">
        <i class="fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i>
        <span>Logout</span>
      </button>
    </form>
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
